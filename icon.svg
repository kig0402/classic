  <!-- Brand Typography -->
  <text x="256" y="465" font-family="'Cinzel', serif, 'Times New Roman'" font-size="34" font-weight="700" letter-spacing="8" fill="url(#goldGrad)" text-anchor="middle">OPUS</text>
